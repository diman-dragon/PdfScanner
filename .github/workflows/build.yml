name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        run: gradle assembleDebug --stacktrace

      # Подпись должна быть одной и той же во всех сборках, иначе Android не обновит приложение
      # поверх установленного. Если отпечаток не совпал, сборка падает с понятной причиной.
      - name: Проверка подписи APK
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "::warning::apksigner не найден, проверка подписи пропущена"; exit 0; fi
          FP=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep "certificate SHA-256 digest" | head -1 | awk '{print $NF}')
          echo "SHA-256 подписи: $FP"
          EXPECTED="215f256b47d343b794c5338ae8a592868e8fb180eda22bb43317c3deb0371fd0"
          if [ -z "$FP" ]; then echo "::warning::не удалось прочитать подпись, проверка пропущена"; exit 0; fi
          if [ "$FP" != "$EXPECTED" ]; then
            echo "::error::Подпись APK не совпала с ожидаемой. Проверьте, что в репозитории есть app/debug-keystore.b64"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PdfScanner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # На main/master APK дополнительно кладётся в релиз "latest" (прямая ссылка, удобно с телефона).
      # Тег latest создаётся один раз и больше НЕ пересоздаётся: раньше он каждый раз удалялся и
      # создавался заново на новом коммите, из-за чего git fetch/pull ругался на конфликт тегов.
      # Теперь обновляется только файл и описание релиза.
      - name: Publish to "latest" release
        if: contains(fromJSON('["refs/heads/main","refs/heads/master"]'), github.ref)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          NOTES="Коммит ${GITHUB_SHA::7}. Сборка №${GITHUB_RUN_NUMBER}"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK" --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest "$APK" --prerelease --title "Debug build" \
              --notes "$NOTES" --target "$GITHUB_SHA"
          fi
